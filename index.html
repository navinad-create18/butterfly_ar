<!DOCTYPE html>
<html lang="en">
<head>
<title>Butterfly AR</title>
 <!-- include A-Frame obviously -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<!-- include ar.js for A-Frame -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style='margin : 0px; overflow: hidden;'>
  <a-scene embedded arjs>
    <!-- define a camera which will move according to the marker position -->
    <a-marker type='pattern' url='butterfly_drawing.patt'>
           <!-- use your gltf model -->
      <a-entity gltf-model="monarch_modFinal.glb" position = "0 0 0" scale = "0.65 0.65 0.65"></a-entity>
      </a-marker>
    
    <a-marker type='pattern' url='woodland_skipper.patt'>
           <!-- use your gltf model -->
      <a-entity gltf-model="woodland_skipper_butterfly_mod1.glb" position = "0 0 0" scale = "0.65 0.65 0.65"></a-entity>
      </a-marker>
      
      <a-entity camera></a-entity>
  
  </a-scene>
</body>
</html>
